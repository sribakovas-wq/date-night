<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100a0d">
  <title>Maža staigmena tau ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <audio id="music" src="music.mp3" preload="auto" autoplay loop playsinline></audio>

  <main id="story" class="story">
    <div class="eyebrow">MAŽA STAIGMENA TAU</div>
    <h1>Kelios mūsų akimirkos…</h1>
    <p class="lead">Brauk pirštu per kortelę ir atskleisk, kas slepiasi po ja ❤️</p>

    <section id="card" class="card">
      <img id="photo" alt="Mūsų akimirka">
      <div class="copy">
        <div id="message"></div>
        <span id="counter"></span>
      </div>
      <canvas id="scratch" aria-label="Nutrink kortelę pirštu"></canvas>
    </section>

    <p id="hint">Nutrink didžiąją dalį kortelės ✨</p>
    <button id="next" type="button" hidden>Kita akimirka →</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
