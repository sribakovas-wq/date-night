<!doctype html>
<html lang="lt">
<head>

<title>Maža staigmena tau ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<audio id="music" src="music.mp3" preload="auto" loop playsinline></audio>

<main id="story">

<section id="card">

<canvas id="scratch"></canvas>
<div class="photoText">

</div>

<button id="next" type="button" hidden>Kita akimirka →</button>
</main>
<script src="script.js"></script>
</body>
</html>
